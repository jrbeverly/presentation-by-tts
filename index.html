<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation by TTS</title>
<style>
  body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #f4f1ff; background: linear-gradient(160deg, #2b0f5c, #5b1a8a 50%, #c2366b); min-height: 100vh; }
  main { max-width: 1080px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; margin: 0 0 12px; }
  .lede { max-width: 680px; color: #e2d4ff; margin: 0 0 28px; }
  video { width: 100%; border-radius: 16px; box-shadow: 0 20px 60px #0008; background: #000; }
  h2 { margin: 40px 0 12px; }
  .voices { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .voice { background: #ffffff1a; border-radius: 16px; padding: 16px 20px; }
  .voice h3 { margin: 0 0 8px; font-size: 1rem; color: #ffc4e1; }
  audio { width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Presentation by TTS</h1>
  <p class="lede">Sprint data compiled into a Reveal.js deck with Chatterbox narration, recorded to MP4 with measured audio driving slide timing.</p>

  <video controls preload="metadata" src="docs/presentation.mp4"></video>

  <h2>Candidate voices</h2>
  <div class="voices">
    <div class="voice"><h3>Agenda · Ben Tucker</h3><audio controls preload="none" src="docs/01-agenda-ben-tucker.wav"></audio></div>
    <div class="voice"><h3>Sprint metrics · Karen Savage</h3><audio controls preload="none" src="docs/02-sprint-metrics-karen-savage.wav"></audio></div>
  </div>
</main>
</body>
</html>
